version: 1
groups:
  - annotation: Tour settings
    options:
      - key: ckanext.tour.collapse_steps
        type: bool
        default: true
        description: If enabled, the tour steps will be collapsed on edit/create
        editable: true

      - key: ckanext.tour.launcher_position
        default: bottom-right
        description: >-
          Where the floating "Start tour" button is anchored on pages that have
          a tour. One of "bottom-right" or "bottom-left".
        editable: true
